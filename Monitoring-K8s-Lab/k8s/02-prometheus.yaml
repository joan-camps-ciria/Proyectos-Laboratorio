# ===== Permisos: Prometheus necesita leer la API de Kubernetes para descubrir qué monitorizar =====
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
# ===== Configuración y reglas de alerta =====
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alertas.yml

    scrape_configs:
      # Prometheus se monitoriza a sí mismo
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Descubre automáticamente los pods detrás del Service "node-exporter"
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names: [monitoring]
        relabel_configs:
          # Solo los endpoints del Service node-exporter
          - source_labels: [__meta_kubernetes_service_name]
            regex: node-exporter
            action: keep
          # Usa el nombre del nodo como "instance" en vez de la IP
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

  alertas.yml: |
    groups:
      - name: servidor
        rules:
          - alert: NodeExporterCaido
            expr: absent(up{job="node-exporter"} == 1)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "No se reciben métricas de ningún node-exporter"

          - alert: CPUAlta
            expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m]))) > 80
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "CPU por encima del 80% en {{ $labels.instance }}"

          - alert: MemoriaAlta
            expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Memoria por encima del 90% en {{ $labels.instance }}"

          - alert: DiscoCasiLleno
            # Discos físicos (no tmpfs ni overlay); "max by device" evita repetir el mismo disco montado en varias rutas
            expr: max by (instance, device) (100 * (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"})) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disco {{ $labels.device }} por encima del 85% en {{ $labels.instance }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            # Permite recargar la configuración con: curl -X POST localhost:9090/-/reload
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: datos
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Lab: los datos se pierden si el pod se recrea. En producción sería un PersistentVolumeClaim
        - name: datos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
